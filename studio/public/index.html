<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Motion Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script>
    // Applique le thème choisi avant l'affichage (évite un flash blanc la nuit).
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">LM</span><span>Link Motion <em>Studio</em></span></div>
    <div class="top-right">
      <label class="client-select">
        <span>Client</span>
        <select id="clientSelect"></select>
      </label>
      <button class="btn theme-toggle" id="themeToggle" type="button" title="Mode jour / nuit" aria-label="Mode jour / nuit">🌙</button>
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="create">Créer</button>
    <button data-view="posts">Posts</button>
    <button data-view="adn">ADN client</button>
    <button data-view="hooks">Hooks</button>
    <button data-view="images">Images</button>
    <button data-view="veille">Veille</button>
    <button data-view="study">Étude de marché</button>
    <button data-view="settings">Réglages</button>
  </nav>

  <div id="banner"></div>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
