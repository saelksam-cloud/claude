<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Motion Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/workspace.css">
  <script>
    // Applique le thème choisi avant l'affichage (évite un flash blanc la nuit).
    try { const t = JSON.parse(localStorage.getItem('theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>

  <a class="skip" href="#view">Aller au contenu</a>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo"><svg aria-hidden="true" viewBox="0 0 32 32" fill="none"><path d="M7 21 13 9v12l6-12v12l6-12" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Link Motion<small>STUDIO ÉDITORIAL</small></span></div>
    <nav class="tabs" id="tabs" aria-label="Navigation principale"><div class="nav-flat"><button type="button" data-view="atelier"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="14" rx="1.5"/><rect x="15" y="5" width="6" height="14" rx="1.5"/><path d="M9 12h6m-2-2 2 2-2 2"/></svg><span>Atelier</span></button><button type="button" data-view="calendar"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h2m3 0h2m3 0h1m-11 3h2m3 0h2"/></svg><span>Calendrier</span><span class="nav-count" data-review-count hidden></span></button><button type="button" data-view="images"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 8v11a2 2 0 0 0 2 2h11m-9-7 4-4 3 3 3-5 4 5"/></svg><span>Visuels</span></button><button type="button" data-view="banner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-12 0v11"/></svg><span>Bannières</span></button><button type="button" data-view="veille"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7a5 5 0 1 0 5 5m-5 0 7-7"/><circle cx="12" cy="12" r="1"/></svg><span>Veille</span></button></div></nav>
    <div class="side-secondary"><button type="button" data-view="settings" class="nav-secondary"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="m9 3-1 3-3 1-2 4 2 2v4l3 2 3-1 3 2 4-2v-3l3-3-2-4-3-1-1-3Z"/></svg><span>Réglages</span></button></div>
    <div class="side-footer"><span class="side-status"></span> Espace de travail <span class="version">STUDIO</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><span>Studio éditorial</span><span aria-hidden="true">/</span><strong id="location">Studio</strong></div>
      <div class="top-right">
        <label class="client-select"><span>Client</span><select id="clientSelect"></select></label>
        <button class="btn sm" type="button" data-view="client" title="Audit, préférences, profil et charte de ce client">Fiche client</button>
        <button class="btn icon-btn" data-action="quick-search" title="Rechercher (/)" aria-label="Rechercher"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><path d="m14.5 14.5 5 5"/></svg></button>
        <button class="btn icon-btn" data-action="jobs" id="jobsButton" title="Activité IA" aria-label="Activité IA"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span class="job-dot" hidden></span></button>
        <button class="btn icon-btn theme-toggle" id="themeToggle" type="button" title="Mode jour / nuit" aria-label="Mode jour / nuit">🌙</button>
      </div>
    </header>
    <div id="banner"></div>
    <main id="view" tabindex="-1" aria-label="Espace de travail"><div class="skeleton" role="status">Chargement de l’espace de travail…</div></main>
  </div>
  <button class="nav-shade" data-action="mobile-menu" aria-label="Fermer le menu"></button>
  <nav class="mobile-nav" aria-label="Raccourcis mobiles">
    <button type="button" data-view="atelier"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="6" height="14" rx="1.5"/><rect x="15" y="5" width="6" height="14" rx="1.5"/><path d="M9 12h6m-2-2 2 2-2 2"/></svg><span>Atelier</span></button><button type="button" data-view="calendar"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h2m3 0h2m3 0h1m-11 3h2m3 0h2"/></svg><span>Calendrier</span><span class="nav-count" data-review-count hidden></span></button><button type="button" data-view="images"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 8v11a2 2 0 0 0 2 2h11m-9-7 4-4 3 3 3-5 4 5"/></svg><span>Visuels</span></button><button type="button" data-view="banner"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18m-12 0v11"/></svg><span>Bannières</span></button><button type="button" data-view="veille"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7a5 5 0 1 0 5 5m-5 0 7-7"/><circle cx="12" cy="12" r="1"/></svg><span>Veille</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <dialog id="postDrawer" aria-labelledby="drawerTitle"></dialog>
  <dialog id="activityDialog" aria-labelledby="activityTitle"></dialog>
  <dialog id="searchDialog" aria-labelledby="searchTitle"></dialog>

  <dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
